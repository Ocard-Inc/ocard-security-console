[project]
name = "ocard-security-console"
version = "0.1.0"
description = "Ocard Security Log Console — ClickHouse log 即時異常監測主控台與輪詢告警"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "clickhouse-connect>=0.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "sqlglot>=25.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
id: R03
name: API 單一來源大量讀取
severity: P2
source: api
kind: sql_threshold
window_minutes: 60
cooldown_minutes: 120
sql: |
  SELECT src, concat(controller, '/', function) AS endpoint,
         count() AS metric, uniq(_brand) AS brands,
         sumMap([_brand], [toUInt64(1)]) AS brand_map
  FROM (
    SELECT multiIf(JSONExtractString(headers, 'X-real-ip') != '', JSONExtractString(headers, 'X-real-ip'),
                   JSONExtractString(headers, 'x-real-ip') != '', JSONExtractString(headers, 'x-real-ip'),
                   trim(BOTH ' ' FROM splitByChar(',', if(JSONExtractString(headers, 'X-forwarded-for') != '',
                        JSONExtractString(headers, 'X-forwarded-for'),
                        JSONExtractString(headers, 'x-forwarded-for')))[1])) AS src,
           controller, function, _brand
    FROM ods_api_log
    WHERE create_time >= %(start)s AND create_time < %(end)s
  )
  WHERE src != ''
  GROUP BY src, endpoint
  HAVING metric >= 2000
threshold:
  # baseline_key 必須與上面 SQL 的 GROUP BY 同單位（src, endpoint）。
  # 曾誤用 api_src_60m（只 GROUP BY src、跨全部 endpoint），實測 P99 差 26 倍，
  # 門檻因此系統性偏高、規則長期漏抓，事件頁的「資料限制」也在陳述錯的母體。
  # 見 checker/calibrate.py 的 6b。
  static_floor: 4000
  baseline_key: api_src_ep_60m
  population: true
  stat: p99
  factor: 3
entity:
  - {col: src, fp: src}
  - {col: endpoint, fp: null}
note: 單一來源逐筆讀取（設計稿案例 C：Api2/TransDetail）；來源 IP 由 forwarded header 推導屬未驗證來源

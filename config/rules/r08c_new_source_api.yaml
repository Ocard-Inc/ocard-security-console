id: R08C
name: 新來源首次出現（API）
severity: P3
source: api
kind: new_source
known_kind: api_src
window_minutes: 10
cooldown_minutes: 240
min_events: 100
sql: |
  SELECT src, count() AS metric, uniq(_brand) AS brands
  FROM (
    SELECT multiIf(JSONExtractString(headers, 'X-real-ip') != '', JSONExtractString(headers, 'X-real-ip'),
                   JSONExtractString(headers, 'x-real-ip') != '', JSONExtractString(headers, 'x-real-ip'),
                   trim(BOTH ' ' FROM splitByChar(',', if(JSONExtractString(headers, 'X-forwarded-for') != '',
                        JSONExtractString(headers, 'X-forwarded-for'),
                        JSONExtractString(headers, 'x-forwarded-for')))[1])) AS src, _brand
    FROM ods_api_log
    WHERE create_time >= %(start)s AND create_time < %(end)s
  )
  WHERE src != ''
  GROUP BY src
  HAVING metric >= 100
entity:
  - {col: src, fp: src}
note: 來源 IP 由 forwarded header 推導，屬未驗證來源

id: R02
name: 敏感路由大量遍歷
severity: P1
source: backend
kind: sql_threshold
window_minutes: 60
cooldown_minutes: 120
sql: |
  SELECT arrayStringConcat(arraySlice(splitByChar('/', route), 1, 2), '/') AS route2,
         count() AS metric, uniq(acc) AS accs, uniq(ip) AS ips, uniq(_brand) AS brands
  FROM ods_backend_sys_log
  WHERE create_time >= %(start)s AND create_time < %(end)s
    AND arrayStringConcat(arraySlice(splitByChar('/', route), 1, 2), '/') IN
        ('orderlist/detail', 'orderlist/delivery', 'orderlist/summary',
         'customer/profile', 'customer/voucherList', 'point/get-analysis-data')
  GROUP BY route2
  HAVING metric >= 400
threshold:
  static_floor: 800
  baseline_key: "backend_route_60m:{route2}"
  stat: p95
  factor: 2.5
entity:
  - {col: route2, fp: null}
note: orderlist/detail 遍歷爬取（7/16 攻擊 ~35,000/hr vs 常態白天 ~50/hr）

# Ocard Security Log Console — 全域設定
#
# 這個檔案進版控，所以只放「所有環境都一樣」的行為參數。
# 隨環境而異的網址與憑證一律放 .env：
#   ROS_BASE_URL      Ocard ROS 的網址（留空 = 沒有登入保護）
#   CONSOLE_BASE_URL  本主控台的對外網址；同時決定 Slack 連結前綴與掛載路徑
app:
  # uvicorn 的監聽位址（服務自己綁在哪，不是對外網址）。只聽本機，
  # 對外一律經 reverse proxy —— 見 docs/deploy-with-ros.md。
  host: 127.0.0.1
  port: 8600
  env_label: Production

ros:
  # Ocard ROS 是統一登入入口。本主控台不自己做登入：轉發瀏覽器送來的
  # ROS session cookie 給 /api/auth/me 換取身分，再看有沒有
  # security.console 這個 feature 決定放不放行。沒有分級 —— 進得來就是完整功能。
  #
  # 網址在 .env 的 ROS_BASE_URL。這裡的 enabled 是總開關：即使設了網址，
  # 也能臨時關掉（例如 ROS 維護時改用離線模式）。
  enabled: true
  # 身分快取秒數。ROS 自己有 10 秒快取，這層是避免單一頁面載入時
  # 數個 API 各打一次 ROS；設短一點讓權限撤銷幾乎即時生效。
  cache_ttl_seconds: 30

time:
  timezone: Asia/Taipei
  # 資料由 Mongo 同步進 ClickHouse 約 5 分鐘落地延遲，再加 1 分安全邊際
  lag_buffer_minutes: 6
  # 五分鐘檢查對齊邊界
  tick_minutes: 5

business_hours:
  start: 8   # 08:00（含）
  end: 23    # 23:00（不含）→ 23:00–08:00 視為非上班時間

data_sources:
  # UI 顯示名稱 → ClickHouse 表
  admin:
    label: Admin Log
    table: ods_admin_log
  backend:
    label: Backend System Log
    table: ods_backend_sys_log
  api:
    label: API Log
    table: ods_api_log
  auth:
    label: Auth Log
    table: ods_auth_log
    sensitive: true
  # 2026-08-06 接入。POS 與 oboss 的訂單操作（接單／拒單／完成／改庫存）。
  #
  # 這張表與另外四張有四個結構性差異，會決定它在主控台能做什麼：
  #   ① **沒有 ip 也沒有 headers** → 完全沒有來源 IP 維度。來源排名、
  #      依 IP 反查、entity_extent 對它都不成立（見 explorer.GROUP_BY["source"]
  #      刻意沒有 order，以及 tests/test_data_source_coverage.py 的反向測試）。
  #   ② 沒有 acc → 操作者只有 _admin（整數），名稱由 core/admins.py 補。
  #   ③ 沒有 status／error/has_error → 沒有錯誤分析。
  #   ④ 沒有 order_number → 沒有 unique resource 分析。
  #
  # 實測（2026-08-06）：2.45 億列、6.91 GiB、約 123 萬筆/日、2026-01-01 起 218 天
  # （比 api_log 的 179 天更長）、落地延遲約 5 分鐘、重複率 3.2%。
  # 列寬 30 bytes/列（api_log 是 155），所以 180 天的每一種分析都在 13 秒內 ——
  # **不需要為它另設較短的區間上限**，詳見 audit_export 那一節。
  order:
    label: Order Log
    table: ods_order_api_log
  # 2026-08-07 接入。im.ocard.co 的批次匯入排程（NinexNine／Olivo／Pigeon／
  # PosTrans／GoogleMyBusiness 等 import_* 工作）。
  #
  # **這是可靠度 log，不是行為 log。** 實測 297 列全部是內部排程用 curl 打進來的：
  #   - `ip` 100% 是 `0.0.0.0`（不是「有時候」，是全部）→ 沒有來源維度
  #   - `input` 100% 是空的（`[]`）→ 沒有 payload 維度
  #   - 沒有 `_brand` / `_store` / `acc`
  # 所以不該對它抱有「抓到攻擊」的期待。它回答的是「這個批次有沒有跑、
  # 量有沒有突然變化」，而批次整個停掉或突然爆量都是真實訊號。
  #
  # 欄位形狀幾乎等同 ods_backend_sys_log（route／controller／function 都是
  # 真欄位），而且**時間欄位就叫 create_time、就是台北牆鐘** ——
  # 五張新表裡唯一不需要任何時間處理改動的一張。
  #
  # 實測（2026-08-07 03:00，剛上線）：297 列、8.78 KiB、2026-08-07 01:46 起、
  # 約 290 筆/小時 ≈ 7,000 筆/日。
  batch:
    label: Batch Import Log
    table: ods_batch_request_log
  # 2026-08-07 接入。api-console.ocard.co（PHP 後台 API）的請求紀錄。
  #
  # 五張新表裡欄位最結構化的一張：requester.{ipAddress, xForwardedForRaw,
  # userAgent}、request.{method, path, controllerClass, controllerMethod}、
  # response.{statusCode, durationMilliseconds}、authentication.{tokenPresent,
  # tokenValid, tokenFingerprint, account, brandIdx, role} 都已經拆好。
  #
  # **兩個空洞（2026-08-07 實測，上游問題）：**
  #   ① authentication.account 全部是空字串、tokenValid 全部 false，
  #      連 2,120 筆 tokenPresent=1 也一樣 —— 身分解析沒有寫入。
  #      登入帳號改由 body.account 取得（那一段上游有寫），所以 actor 是兩層
  #      fallback。修好之後這張表會是唯一「誰、從哪、做了什麼、成功還是失敗」
  #      四件齊全的表。
  #   ② authentication.brandIdx 全部 null → 沒有品牌維度。
  #
  # **requester.ipAddress 不可以當來源 IP**：實測 53% 的列沒有
  # xForwardedForRaw，而那些列的 ipAddress 全部是 10.100.0.173（我方 LB）、
  # 全部是 Welcome/index 健康檢查。coalesce 進來的話它會穩居每一份來源排名
  # 第一名，而它不是任何「來源」。
  #
  # body 的密碼上游已指紋化（password: "fingerprint:…"）。
  # 時間只有 recordedAt 而且是 **UTC**；expiresAt = recordedAt + 90 天。
  #
  # 實測（2026-08-07 03:00，剛上線）：9,806 列、505 KiB、
  # 2026-08-06 18:25（台北）起、約 3.3 萬筆/日。
  console:
    label: Console API Log
    table: ods_console_backend_sys_log
  # 2026-08-07 接入。dlc.ocard.co 的報表服務 —— console.ocard.co 從這裡
  # 列出與下載報表。
  #
  # **五張裡與資料外流最直接相關的一張**：報表下載就是把資料帶走。
  # 路由只有三種：GET /api/reports（清單）、POST /api/reports（建立）、
  # GET /api/reports/{id}?download=1（實際下載）。
  #
  # 欄位全部是真欄位（五張新表裡唯一的）：idx / method / uri / ip / headers /
  # body / status_code / duration_ms / response_headers / response_body /
  # created_at / updated_at。
  #
  # **兩個陷阱：**
  #   ① `created_at` 是**台北牆鐘**，與 ods_voucher_request_log /
  #      ods_ec_request_log 的同名欄位語意相反（那兩張是 UTC）。實測依據：
  #      created_at = 2026-08-07 01:30:12 那列的 response_headers.date
  #      是 Thu, 06 Aug 2026 17:30:12 GMT。
  #   ② 同一個 `idx` 會短暫有兩列 —— 請求開始寫一列（status_code = 0、
  #      response 空），完成後再寫一列，兩列 created_at 相同、靠 updated_at
  #      區分。ReplacingMergeTree 合併後只剩一列（實測 2026-08-07 20:35 已是
  #      986 列 / 986 個相異 idx、0 筆 status_code = 0），但**合併前的視窗內
  #      計數會多算**。綱要的 dedup_order 記著這件事，健康卡的重複率會顯示它。
  #
  # headers.cookie 上游已 ***REDACTED***，但 headers.authorization 沒有
  # （164/164 列都有），而且是陣列形狀 —— 靠 masking.scrub_text() 清洗。
  #
  # 實測（2026-08-07）：986 列、2026-08-06 18:33（台北）起、約 20 筆/小時。
  request:
    label: Report Service Log
    table: ods_request_log
    # 實測 2026-08-06~08 共 994 個間隔：p50=0、p95=5、**最長 152 分**，
    # 11 個超過 20 分鐘。180 分鐘涵蓋實測的最長間隔並留餘裕 ——
    # 真的失速（例如整晚沒進資料）仍然抓得到。
    freshness_alert_minutes: 180
  # 2026-08-07 接入。voucher.ocard.co 的票券／兌換 API 請求紀錄。
  #
  # **完全沒有來源 IP** —— header 只有 host / content-* / x-ocard-channel-id /
  # x-ocard-channel-secret，全部是伺服器對伺服器呼叫。這與 Order Log 是同一類
  # 結構性限制，不是「我們還沒做」。操作者只能是 x-ocard-channel-id
  # （ocard-api_prod / ocard-admin / momo_prod）。
  #
  # header 的值是 JSON **陣列**（["ocard-api_prod"]），所以要
  # JSONExtract(…, 'Array(String)') 再取第 1 個 —— JSONExtractString 對陣列
  # 會回空字串（= 一個全空的排名），當成字串用則會帶著括號而貼不回篩選器。
  #
  # x-ocard-channel-secret 是**還有效的通道憑證**，由 masking.scrub_text() 清洗
  # （鍵以 secret 結尾，走既有的後綴比對）。
  #
  # request.input.brand 是雜湊 token（例如 lgBZX4）而不是 _brand，
  # 無法對照品牌名，所以沒有品牌維度。
  #
  # created_at 是 **UTC**（分區鍵），created_time 是台北牆鐘。兩者實測是各自
  # 獨立寫入的（ec 那張 3,284 筆裡有 18 筆差 28,799 秒而不是 28,800），
  # 所以不可以用其中一個推導另一個。
  #
  # 實測（2026-08-07 21:00，**回填已完成**）：37,310,599 列、2023-01-07 起連續、
  # 2026-01 約 170 萬列 ≈ 5.3 萬筆/日、**重複率 0.003%**。
  #
  # ⚠️ 先前的設計文件寫「重複 15%」，那是**回填進行中量到的假象** ——
  # ReplacingMergeTree 尚未合併。合併完之後幾乎是零。同 ods_request_log 的
  # in-flight 列，在合併視窗內量到的東西不是穩態。
  #
  # 效能實測（區間上限 180 天，ClickHouse max_execution_time = 55 秒）：
  #   趨勢 1d 桶      0.12 s
  #   呼叫通道排名     4.92 s
  #   逐筆明細 500 筆  1.82 s
  # 全部遠低於上限，**不需要為它另設較短的區間上限**。
  # （對照 api_log：同樣的來源排名在 90 天就會撞上限失敗。voucher 雖然列數多，
  #   但列寬小、JSON 欄位少，差了一個量級。）
  voucher:
    label: Voucher API Log
    table: ods_voucher_request_log

brands:
  # 品牌名稱對照（MySQL ocard.brand）。名稱極少變動，快取 6 小時即可，
  # 避免每五分鐘檢查與每次排名查詢都打 MySQL。
  cache_ttl_seconds: 21600
  max_cached: 20000

sparklines:
  # 統計卡迷你趨勢線：各 log 表最近 N 小時的每小時筆數（一個 UNION ALL；
  # 四張表時實測 0.19 秒，加入 Order Log 後五張表實測 0.41 秒）。
  # 前端每 30 秒輪詢，但每小時桶的邊界一小時才移動一次，120 秒過時完全看不出來。
  hours: 24
  cache_ttl_seconds: 120

freshness:
  # 資料健康狀態閾值（分鐘）— 依設計稿 14.3
  ok: 5
  notice: 10
  stale: 30
  # 規則 R12：落後超過此分鐘數告警。
  #
  # **這是預設值；低流量的表可以在 data_sources 逐張覆寫**
  # （`freshness_alert_minutes`）—— 見 `rules/engine._freshness_threshold()`。
  #
  # 為什麼需要覆寫：R12 量的是「距離最後一筆多久」，而那個值同時混著
  # 「管線延遲」與「這段時間本來就沒有流量」。高流量的表兩者分得開
  # （實測 batch 15,622 個間隔裡只有 1 個超過 20 分鐘），低流量的表分不開 ——
  # 實測 2 天內 ods_request_log 有 11 個間隔超過 20 分（最長 152 分）、
  # ods_ec_request_log 有 12 個（最長 752 分）。用同一個 20 分鐘門檻的話，
  # 那兩張表每天會發好幾則 P2「資料管線失速」而管線完全正常。
  #
  # 把值班的人訓練成忽略告警，等於把這個控制拆掉。
  alert_minutes: 20

baseline:
  window_days: 28
  seed_days: 90            # known_sources 播種範圍
  recalc_hour: 6           # 每日檢查時刻（台北）
  max_age_days: 14         # 基線超齡警告
  # 已知事件污染窗，計算基線時排除（台北牆鐘）
  exclusion_windows:
    - ["2026-07-15 23:00:00", "2026-07-18 00:00:00"]   # 7/16-17 orderlist/detail 大量遍歷事件
    - ["2026-07-30 21:30:00", "2026-07-30 22:30:00"]   # 7/30 Boss 登入成功尖峰

sensitive_routes:
  # backend_sys_log route 前綴（前 2 段）。
  #
  # **這份清單只是「首次播種的種子」。** 2026-08 起唯一真相是 SQLite 的
  # `sensitive_routes` 表（見 store/migrate.seed_after_schema）—— 表建立之後
  # 改這裡**沒有任何作用，而且不會有錯誤訊息**。要改清單請走主控台的規則頁面
  # （改完 R05 下一個 tick 生效、期間掃描下一次執行生效），或直接改表。
  #
  # 兩個讀取端都在執行期向那張表取值：
  #   ① sweep/probes.py 的 P03（%(sensitive_routes)s，由 run.build_params 供值）
  #   ② config/rules/r05_off_hours.yaml 的 SQL（同一個參數，由
  #      rules/engine._sql_params 供值）
  # 2026-08 之前 R05 的 SQL 裡**寫死了第二份副本**，由
  # tests/test_sensitive_routes_consistency.py 綁著兩者一致。那份副本已經消失，
  # 該測試反轉成「SQL 不得含任何路由字面值」。
  #
  # R02（敏感路由大量遍歷）已於 2026-08 退休，由 R14 取代 —— R14 對**全部**
  # route 各自比對自己的基線，不需要事後圈定的清單。
  - orderlist/detail
  - orderlist/delivery
  - orderlist/summary
  - customer/profile
  - customer/voucherList
  - point/get-analysis-data
  # 2026-08-05 加入：當天那起逐 ID 遍歷（131.143.239.176 / homeyakiniku，
  # 凌晨 4,726 次）打的就是這條，而 R05 全天靜音。
  - customer/index

internal_accounts:
  # 內部/高權限帳號，新來源首見時升級為 critical
  prefixes: ["ocard"]
  accounts: ["andrew_c", "market", "wu-tau"]

alerting:
  cooldown_minutes: 60
  resolve_after_ticks: 3
  max_catchup_hours: 2
  daily_summary_hour: 9

audit_export:
  # Log Explorer 與匯出的時間範圍上限。
  #
  # 原值 62 是專案初版就帶進來的、沒有依據的數字（大約「兩個月」）。2026-08-03
  # 實測後放寬到 180 天 —— api_log 只保留約 179 天（2026-02-06 起、3.4 億列），
  # 所以 180 對它實質等於「全部資料」。
  #
  # 實測（api_log 全區間 178 天，ClickHouse max_execution_time = 55 秒）：
  #   Request 趨勢 1d 桶      0.5 s
  #   Unique resource         0.6 s
  #   Endpoint 排名／建議選單  4.4 s
  #   錯誤分析                5.8 s
  #   Actor 排名              9.4 s
  #   來源排名（api）          撞 55 秒上限失敗；90 天就已在邊緣（測兩次：失敗 / 52.7 s）
  #   逐筆明細（api）          撞 55 秒上限失敗（重測兩次皆失敗）
  #
  # **兩個會失敗的查詢刻意不另設較短上限**（已知取捨，2026-08-03 決定）：
  # 選了長區間再跑這兩種分析，會等 55 秒然後拿到「查詢超時」。
  #   - 來源排名貴在 API_SRC_IP 對 headers 逐列 JSONExtract。
  #   - 逐筆明細貴在五張表的 sorting key 不含時間、只有月分區，
  #     所以 ORDER BY create_time DESC 必須讀完全部列才能排序，LIMIT 救不了。
  #     （Order Log 是唯一的例外性好消息：列寬只有 30 bytes，180 天全區間仍在
  #     13 秒內，見下面 data_sources.order 的註解，不需要另設較短上限。）
  # 62 天對這兩種都實測穩定（23.0 s / 23.5 s），那是它一直沒出事的原因。
  max_range_days: 180
  detail_row_limit: 500000

# 例外名單（allowlist）。它是整個系統唯一的靜音開關，所以這裡的每個值都是
# 「這個盲區可以有多大、多久」。
allowlist:
  # intel.refresh --seed-allowlist 播種的條目多久到期。
  # 永久生效的抑制沒有人會回頭檢查；會自己到期的抑制比任何核准流程都有效。
  seed_valid_days: 365
  # rule_suppressions 的保留期限（每日排程修剪）。每個 tick、每個被抑制的
  # 命中一列，量不大但無上限。
  suppression_retention_days: 90
  # 清單上「即將到期」的提醒天數。**只是畫面上的標示** ——
  # 系統不會寄信也不會發 Slack 通知任何人（沒有那個管道）。
  expiring_soon_days: 7

# **目前沒有任何程式讀這段設定。** `grep -rn "sql_console" src/ web/` 只命中這個檔案
# 自己；唯一長得像會用到它的地方是 `rules/loader._allowed_tables()`，但那個函式讀的是
# `data_sources`，不是這裡。前端 NAV 有一個「SQL Console」頁面入口，但那頁目前顯示
# 「尚未實作」（見 `web/app.js`）——這段設定看起來像是為那個未完成的功能預先寫的白名單，
# 但頁面沒做出來，這裡也就沒有消費端。
# 2026-08 接入 Order Log 時，設計文件曾把這段稱為「獨立的第二份白名單」並要求
# `allowed_tables` 跟著 `data_sources` 一起加 `ods_order_api_log`——那句話已經修正
# （見 `docs/superpowers/specs/2026-08-06-order-log-integration-design.md`）：加了只是
# 為了與 `data_sources` 的清單保持一致，不構成任何實際的白名單保護。
# **不要因為看起來沒用就刪掉這段**：SQL Console 可能是未完成或已移除的功能，
# 刪掉設定會讓下一個人更難判斷究竟是哪一種。留言的目的只是不要讓人誤以為它在保護什麼。
sql_console:
  auto_limit: 1000
  timeout_seconds: 30
  allowed_tables:
    - ods_admin_log
    - ods_backend_sys_log
    - ods_api_log
    - ods_auth_log
    - ods_order_api_log
  forbidden_output_columns:
    - token
    - headers
    - params
    - post_params
    - get_params
    - response
    - acc
    - ip
    - order_number

llm:
  # AI 研判草稿（期間異常掃描的敘事段落）。總開關比照 ros.enabled ——
  # 即使裝了套件、設了 key，也能臨時關掉。
  #
  # 關掉時掃描完全正常，只是不產生敘事段落。LLM 從來不是這個功能的必要條件。
  #
  # 送出去的是 report.build() 的結構化輸出：對象、數字、探針名稱、訊號標籤、
  # 限制段落。**其中的「對象」是原始帳號與原始來源 IP** —— 這一段在 2026-08 的
  # 呈現政策變更前寫的是「沒有原始 IP／帳號」，那已經不成立（詳見
  # src/console/sweep/narrate.py 的模組說明）。
  # 沒有送出的是 token 值、params／headers 原文、消費者手機與 Email。
  # API key 放 .env 的 ANTHROPIC_API_KEY。
  enabled: true
  model: claude-opus-5
  max_tokens: 16000
